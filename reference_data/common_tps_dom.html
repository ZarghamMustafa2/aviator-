/* Login — a declaration-for-declaration copy of bpexch.live/Users/Login.
   Their layout is reproduced by copying the CSS itself (flex container + a percentage
   margin under the card), NOT by hard-coding the positions it happens to produce — that
   way every viewport lands where theirs does instead of only the ones we measured. */
.login-screen {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  padding: 15px;
  font-family: "Poppins", system-ui, "Segoe UI", sans-serif;
  background-color: #2b2b2b;
  background-image: url("/assets/icons/bg-diamonds2.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.login-card {
  width: 400px;
  max-width: 100%;
  padding: 55px 55px 37px;
  /* percentage of the container's WIDTH — this is what lifts the card above true centre,
     and why it tracks the viewport the way theirs does */
  margin-bottom: 10%;
  border-radius: 10px;
  background: linear-gradient(#3e6d8d, #121d30);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.bp-logo-link {
  display: block;
  /* pulled 20px up out of the card's top padding, exactly like their logo span */
  margin: -20px auto 20px;
  line-height: 0;
}

.bp-logo {
  width: 120px;
  height: 120px;
  border-radius: 60px;
  object-fit: cover;
  display: block;
}

.login-field {
  position: relative;
  width: 100%;
  height: 47px;
  border-bottom: 2px solid rgba(255, 255, 255, .24);
  color: #fff;
  margin: 0 0 30px;
}

/* Sits over the field: carries the icon AND the underline that sweeps in on focus. */
.login-focus {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.login-focus::before {
  content: "";
  position: absolute;
  left: 0;
  top: 45px;
  width: 0;
  height: 2px;
  background: #fff;
  transition: .4s;
}

.login-field input:focus ~ .login-focus::before {
  width: 100%;
}

/* 22px = the font-size bpexch renders the glyph at; top 10px lands it on the same baseline
   their text-rendered icon sits on (verified by pixel-measuring both cards). */
.login-ico {
  position: absolute;
  left: 5px;
  top: 10px;
  width: 22px;
  height: 22px;
  fill: #fff;
}

.login-field input {
  display: block;
  width: 100%;
  height: 45px;
  padding: 0 5px 0 38px;
  border: 0;
  outline: 0;
  background: transparent;
  color: #fff;
  font-size: 16px;
  font-weight: 400;
  /* !important is required: a global `html, body, button, input, select, textarea` rule
     also uses !important, so only a more specific !important rule can win it back. */
  font-family: "Poppins", system-ui, "Segoe UI", sans-serif !important;
}

.login-field input::placeholder {
  color: #fff;
  opacity: 1;
}

/* Keep autofilled inputs transparent with white text (no Chrome white/yellow box) */
.login-field input:-webkit-autofill,
.login-field input:-webkit-autofill:hover,
.login-field input:-webkit-autofill:focus,
.login-field input:-webkit-autofill:active {
  -webkit-text-fill-color: #fff;
  caret-color: #fff;
  -webkit-box-shadow: 0 0 0 1000px transparent inset;
  transition: background-color 100000s ease-in-out 0s;
  background-clip: content-box;
}

.login-btn-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
}

.login-btn {
  width: 120px;
  height: 50px;
  /* no top margin — the 30px under the password field is the whole gap, as on bpexch */
  margin: 0;
  padding: 0 20px;
  border: 0;
  border-radius: 25px;
  background-image: linear-gradient(to top, #3e6d8d, #121d30);
  color: rgba(255, 255, 255, .9);
  font-size: 16px;
  font-weight: 500; /* their button ships as Poppins-Medium */
  font-family: "Poppins", system-ui, "Segoe UI", sans-serif !important;
  cursor: pointer;
  box-shadow: 0 8px 16px rgba(0, 0, 0, .2), 0 6px 20px rgba(0, 0, 0, .6);
}

.login-btn[disabled] {
  opacity: .7;
  cursor: default;
}

/* Remember Me (boss 2026-08-27): tick par id/password device me save — agli dafa pehle se likha aaye.

/* Bottom band: a 6px accent line over a dark strip, the way bpexch closes the page.

@media (max-width: 600px) {

  .login-card {
    padding: 55px 15px 37px;

  }

    <script>/* FIX-C M1' — static login-shell handoff (injected inline into index.html by vite injectLoginShell).
   Paints a pixel-identical login BEFORE the React bundle + legacy app.js execute (cold-FCP win),
   then hands off seamlessly when app.js renders the real login/dashboard. No framework, runs at parse. */
(function () {
  var shell = document.getElementById("login-shell");
  if (!shell) return;

  // Returning user (has logged in on this browser): app.js boots straight to the dashboard, so DON'T
  // flash a login shell first. Hide it immediately; the boot-splash/dashboard shows through.
  // (httpOnly token is unreadable from JS; this JS-readable hint mirrors it — set at login, cleared at logout.)
  try { if (localStorage.getItem("bp_hasSession")) { shell.parentNode.removeChild(shell); return; } } catch (e) {}

  // Remember Me (boss 2026-08-27): shell-phase me bhi saved id/pass pehle se bhara dikhe
  // (warna 1-2 second khali dikh kar phir bhar jata — flash). Sirf khali khane bharta hai.
  try {
    var sv = JSON.parse(localStorage.getItem("bp_savedLogin") || "null");
    if (sv) {
      var ui = shell.querySelector('input[name="username"]');
      var pi = shell.querySelector('input[name="password"]');
      if (ui && !ui.value) ui.value = String(sv.u || "");
      if (pi && !pi.value) pi.value = String(sv.p || "");
      var ci = shell.querySelector("#bp-remember-me");
      if (ci) ci.checked = true;
    }
  } catch (e) { /* private mode */ }

  // A-4: if a fast typist submits before app.js is ready, capture it (don't native-submit → reload).
  var pendingSubmit = false;
  var sform = shell.querySelector("form.login-card");
  if (sform) sform.addEventListener("submit", function (e) { e.preventDefault(); pendingSubmit = true; });

  function shellVal(n) { var el = shell.querySelector('input[name="' + n + '"]'); return el ? el.value : ""; }
  function realState() {
    var app = document.getElementById("app");
    if (!app) return null;
    if (app.querySelector("form.login-card")) return "login";
    var kid = app.firstElementChild;                 // authed view (player-shell / dealer) — NOT the boot splash
    if (kid && !kid.classList.contains("boot-splash")) return "authed";
    return null;
  }

  var done = false;
  function handoff(kind) {
    if (done) return; done = true;
    if (obs) obs.disconnect();

    if (kind !== "login") { if (shell.parentNode) shell.parentNode.removeChild(shell); return; }

    // A-4: carry typed username/password into the real login — and KEEP re-applying, because app.js
    // re-renders the login a few times during boot (checkAuth + loadAppConfig), which would otherwise
    // wipe a one-shot copy. Stop as soon as the user types into the real form, or after 5s.
    var uname = shellVal("username"), pw = shellVal("password");
    var su = shell.querySelector('input[name="username"]'), sp = shell.querySelector('input[name="password"]');
    var focusWanted = document.activeElement === sp ? "password" : document.activeElement === su ? "username" : null;
    if (shell.parentNode) shell.parentNode.removeChild(shell);

    var userTyped = false, focused = false, submitted = false;
    function apply() {
      var app = document.getElementById("app");
      var f = app && app.querySelector("form.login-card");
      if (!f) return;
      var ru = f.querySelector('input[name="username"]'), rp = f.querySelector('input[name="password"]');
      if (!userTyped) {
        if (ru && !ru.value && uname) ru.value = uname;
        if (rp && !rp.value && pw) rp.value = pw;
      }
      if (!focused && focusWanted) {
        var t = focusWanted === "password" ? rp : ru;
        if (t) { try { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } catch (e) {} focused = true; }
      }
      // submit-during-shell (A-4): once both fields are populated in a stable form, fire the real submit.
      // Click the real Login button (proven path — same as a manual click) rather than requestSubmit.
      if (pendingSubmit && !submitted && ru && ru.value && rp && rp.value) {
        submitted = true;
        var btn = f.querySelector(".login-btn");
        try { if (btn) btn.click(); else if (f.requestSubmit) f.requestSubmit(); } catch (e) {}
      }
    }
    apply();
    var mo2 = new MutationObserver(apply);
    mo2.observe(document.getElementById("app") || document.body, { childList: true, subtree: true });
    document.addEventListener("input", function (e) { if (e.target && e.target.closest && e.target.closest("form.login-card")) userTyped = true; }, true);
    setTimeout(function () { mo2.disconnect(); }, 5000);
  }

  function tick() { var s = realState(); if (s) handoff(s); }
  var obs = new MutationObserver(tick);
  obs.observe(document.body, { childList: true, subtree: true });
  tick(); // in case app.js already rendered before this ran
  // safety net: never trap the user behind the shell if detection somehow misses
  setTimeout(function () { if (!done) { done = true; if (obs) obs.disconnect(); if (shell.parentNode) shell.parentNode.removeChild(shell); } }, 8000);
})();
